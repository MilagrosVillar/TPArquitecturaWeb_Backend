# Puerto HTTP del backend; se puede cambiar desde SERVER_PORT sin editar código.
server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    # URL y credenciales externos al código: configuración por ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
  jpa:
    hibernate:
      # Para esta etapa inicial JPA crea/actualiza tablas desde las entidades.
      ddl-auto: ${DDL_AUTO:update}
    # Evita mantener abierta la sesión JPA durante toda la respuesta web.
    open-in-view: false
    properties:
      # Normaliza las fechas de persistencia para almacenarlas en UTC.
      hibernate.jdbc.time_zone: UTC
